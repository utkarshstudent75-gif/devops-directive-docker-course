version: "3.9"
services:
  api-node:
    commmand:
      - "npm"
      - "run"
      - "debug-docker"
    ports:
      -"3000:3000"  
      -"9229:9229"
  api-golang:
    commmand:
      - "dlv"
      - "debug"
      - "/app/main.go"
      - "--listen=:8080"
      - "--headless=true"
      - "--log=true"
      - "--log-output=debugger,debuglinerr,gdbwire,lldbout,rpc"
      - "--accept-multiclient"
      - "--continue"
      - "--api-version=2"  
    ports:
      -"3000:3000"  
      -"8080:8080"


